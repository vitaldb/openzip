name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for asset generation)
        run: pip install Pillow

      - name: Build solution
        run: msbuild OpenZip.sln /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /m
        shell: pwsh

      - name: Build MSIX (unsigned)
        run: python msix/build_msix.py
        shell: pwsh

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: openzip-msix
          path: build/msix/*.msix
          if-no-files-found: warn

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: openzip-bin
          path: |
            x64/Release/OpenZipApp.exe
            x64/Release/OpenZipShellExt.dll
          if-no-files-found: warn
